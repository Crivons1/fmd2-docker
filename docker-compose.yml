services:
  fmd2:
    image: ghcr.io/crivons1/fmd2-docker:latest
    container_name: fmd2
    environment:
      - PUID=99
      - PGID=100
      - UMASK=000
      - TZ=Europe/Lisbon
    ports:
      - "3000:3000"
    volumes:
      - /mnt/user/appdata/fmd2:/config
      - /mnt/user/Books/Mangas:/library
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:3000]/"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/Crivons1/fmd2-docker/main/icon.png"
    restart: unless-stopped
